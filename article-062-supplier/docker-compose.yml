name: article062

services:
  purchase-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ont
      POSTGRES_PASSWORD: ont
      POSTGRES_DB: purchase
    command: ["postgres", "-c", "max_prepared_transactions=32"]
    ports:
      - "127.0.0.1:5434:5432"
    mem_limit: 512m

  contract-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ont
      POSTGRES_PASSWORD: ont
      POSTGRES_DB: contract
    command: ["postgres", "-c", "max_prepared_transactions=32"]
    ports:
      - "127.0.0.1:5433:5432"
    mem_limit: 512m

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    mem_limit: 2g
    ulimits:
      memlock:
        soft: -1
        hard: -1

  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    mem_limit: 1g

  seata:
    image: seataio/seata-server:2.0.0
    ports:
      - "127.0.0.1:8091:8091"
      - "127.0.0.1:7091:7091"
    environment:
      SEATA_PORT: 8091
      STORE_MODE: file
    mem_limit: 1g

  doris-fe:
    image: apache/doris:fe-2.1.7
    hostname: doris-fe
    entrypoint: ["bash", "-c"]
    command:
      - |
        unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY all_proxy
        sed -i 's/-Xmx8192m/-Xmx768m/g; s/-Xms8192m/-Xms768m/g' /opt/apache-doris/fe/conf/fe.conf
        grep -q '^priority_networks' /opt/apache-doris/fe/conf/fe.conf || echo 'priority_networks = 172.30.62.0/24' >> /opt/apache-doris/fe/conf/fe.conf
        exec bash /usr/local/bin/init_fe.sh
    environment:
      FE_SERVERS: fe1:172.30.62.10:9010
      FE_ID: "1"
    ports:
      - "127.0.0.1:8030:8030"
      - "127.0.0.1:9030:9030"
    mem_limit: 1536m
    networks:
      ont:
        ipv4_address: 172.30.62.10

  doris-be:
    image: apache/doris:be-2.1.7
    hostname: doris-be
    entrypoint: ["bash", "-c"]
    command:
      - |
        unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY all_proxy
        sed -i 's/-Xmx2048m/-Xmx512m/g' /opt/apache-doris/be/conf/be.conf
        grep -q '^mem_limit' /opt/apache-doris/be/conf/be.conf || echo 'mem_limit = 2G' >> /opt/apache-doris/be/conf/be.conf
        sed -i 's/MAX_MAP_COUNT" -lt 2000000/MAX_MAP_COUNT" -lt 0/' /opt/apache-doris/be/bin/start_be.sh
        sed -i 's/swapon -s | wc -l)" -gt 1/swapon -s | wc -l)" -gt 99999/' /opt/apache-doris/be/bin/start_be.sh
        cd /usr/local/bin
        exec bash /usr/local/bin/entry_point.sh
    environment:
      FE_SERVERS: fe1:172.30.62.10:9010
      BE_ADDR: 172.30.62.11:9050
    depends_on:
      - doris-fe
    mem_limit: 2560m
    ulimits:
      nofile:
        soft: 655350
        hard: 655350
    restart: on-failure
    networks:
      ont:
        ipv4_address: 172.30.62.11

networks:
  ont:
    ipam:
      config:
        - subnet: 172.30.62.0/24
