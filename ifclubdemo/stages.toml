# oncall 分阶段 EP（P3）— 由 scripts/run_stages_llm.sh 消费

[[stage]]
id = "EP1"
title = "db + models + rules + 单测"
tests = "tests/oncall/test_rules.py"
task = """
仅实现 oncall 数据层与硬约束（本阶段不要写 API/前端）：
1) backend/src/oncall/db.py：sqlite3、init_db、create_engineer、list_engineers、shifts helpers
2) models dataclass（字段名必须一致，禁止 datetime.date 类型）：
   - Engineer(id, name, is_active: bool)
   - Shift(id: Optional[int], engineer_id: int, date: str, shift_type: str)  # 字段名必须叫 date，禁止 shift_date
   - Roster(shifts: list)
3) backend/src/oncall/domain/rules.py：
   - class RuleViolation(Exception)
   - def validate_roster(roster, engineers) -> None  # 必须接收 engineers 参数
   - 纯函数：禁止 import/调用 oncall.db / list_engineers / 任何数据库
   - 规则：同日双班、非 active、连续值班>3 天、每日至少 primary+backup 覆盖
4) tests/oncall/conftest.py 与 test_rules.py：构造内存对象测 rules，不依赖真实 DB 表
5) models/__init__.py 仅 re-export（from .engineer import Engineer 等），禁止在 __init__ 重复定义类
约束：from oncall...；兼容 Python 3.9（from __future__ import annotations）；字段与签名跨文件对齐。
"""

[[stage]]
id = "EP2"
title = "scheduler + roster API"
tests = "tests/oncall/test_scheduler.py,tests/oncall/test_api_roster.py"
task = """
在已有 db/models/rules 上实现排班生成与 API（不要重写 models/rules 字段与签名）：
已有符号（必须复用，禁止发明 RosterEntry 等新模型）：
  Engineer(id,name,is_active) / Shift(id,engineer_id,date,shift_type) / Roster(shifts)
  validate_roster(roster, engineers) 来自 oncall.domain.rules
  构造 Shift 只能用：Shift(id=None, engineer_id=..., date=\"YYYY-MM-DD\", shift_type=\"primary\"|\"backup\")
  禁止 engineer_name / type / shift_date 等字段
1) backend/src/oncall/domain/scheduler.py：
   def generate_week(week_start: str, engineers: list) -> Roster
   只使用 is_active=True；若 active 为空则 raise RuleViolation（禁止 ZeroDivisionError）
   现有 rules 只需每天≥1 个 primary；推荐仅 round-robin 分配 primary（不必强行每天 backup）
   排班必须通过 validate_roster（连续值班上限很严，同一人不要连排≥3天）
   冲突抛 RuleViolation；禁止改 rules.py
2) backend/src/oncall/api/roster.py：POST /api/v1/roster/generate
   list_engineers 后交给 generate_week
   冲突：raise HTTPException(status_code=409, detail={\"code\": \"ROSTER_CONFLICT\"})
   成功：{\"week_start\", \"shifts\"}
3) 必要时微调 main.py（不要破坏 /health）
4) tests/oncall/conftest.py：autouse 必须 monkeypatch.setattr(oncall.db, \"DB_PATH\", str(tmp_path/\"t.db\")) 再 init_db
   （不要只设环境变量）
5) test_scheduler.py：内存测 generate_week（≥3 活跃工程师）
6) test_api_roster.py：
   - success：创建≥3 名 active，期望 200
   - conflict：可构造导致 RuleViolation 的输入，期望 409 且 response.json()[\"detail\"][\"code\"]==\"ROSTER_CONFLICT\"
先读磁盘 models/rules/db 再写。
"""

[[stage]]
id = "EP3"
title = "engineers API + smoke"
tests = "tests/oncall/test_api_smoke.py,tests/oncall/test_api_roster.py,tests/oncall/test_rules.py"
task = """
补全工程师 API 与集成冒烟（复用已有 db/roster，不要重写 models/rules/scheduler）：
1) backend/src/oncall/api/engineers.py：
   - GET \"\" → list_engineers()
   - POST \"\" body {name, is_active?} → create_engineer；返回创建后的工程师
   - 对齐已有 oncall.db.create_engineer / list_engineers 签名
2) 必要时微调 main.py（已挂载则别破坏 /health 与 /api/v1/roster）
3) tests/oncall/test_api_smoke.py（TestClient + 依赖 conftest 的 tmp DB）：
   - GET /health → 200
   - POST /api/v1/engineers 创建 ≥3 名 active
   - GET /api/v1/engineers 非空
   - POST /api/v1/roster/generate → 200
不要改 domain/rules.py；冲突断言用 response.json()[\"detail\"][\"code\"]。
"""

[[stage]]
id = "EP4"
title = "frontend"
# 后端回归门禁；前端另以 npm run build 验收
tests = "tests/oncall"
task = """
仅改 frontend/src（不要改 backend/tests）：
已有后端 API（必须对齐，禁止瞎造路径）：
  GET /health
  GET/POST /api/v1/engineers  body {name, is_active?}；列表字段 id/name/is_active
  POST /api/v1/roster/generate  body {week_start}；shifts 含 engineer_id/date/shift_type
1) api/client.ts：apiGet/apiPost；基址 /api/v1
2) 禁止任何 @/ 别名，一律相对路径 import（如 ../api/client）
3) pages/EngineersPage.tsx：列表 + 创建（name）
4) pages/RosterWeekPage.tsx：week_start → generate → WeekGrid
5) pages/RulesPage.tsx：规则说明
6) components/WeekGrid.tsx + App.tsx 路由可用；须能通过 vite build
"""
